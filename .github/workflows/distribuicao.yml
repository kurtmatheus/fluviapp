name: Distribuição

# Empacota assinado e entrega aos testers. Disparado por TAG (`v0.0.2-alpha02`, por exemplo) e não por
# push: distribuir é ato deliberado, e a tag é o registro de qual commit virou qual build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notas:
        description: 'Notas da versão para o tester'
        required: false
        default: 'Build manual da esteira.'

jobs:
  distribuir:
    name: APK assinado → App Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **Homologação × produção pela forma da tag** (SemVer): pré-lançamento tem hífen.
      #
      #   v0.0.3-rc.1  → grupo `homologacao`
      #   v0.0.3       → grupo `producao`
      #
      # Aprovar é um ato explícito e rastreável: criar a tag SEM sufixo apontando para o mesmo commit
      # que já foi homologado. Não há promoção de binário — o `google-services.json` fica embutido no
      # APK, então o que se promove é o commit, e a esteira recompila. Como código e configuração são os
      # mesmos (projeto único, por ora), o artefato de produção difere só em versão.
      #
      # `workflow_dispatch` nunca vai para produção: build de botão é ensaio, e ensaio não estreia.
      - name: Definir destino
        id: destino
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "grupo=homologacao" >> "$GITHUB_OUTPUT"
            echo "canal=ensaio (workflow_dispatch)" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == *-* ]]; then
            echo "grupo=homologacao" >> "$GITHUB_OUTPUT"
            echo "canal=homologação" >> "$GITHUB_OUTPUT"
          else
            echo "grupo=producao" >> "$GITHUB_OUTPUT"
            echo "canal=produção" >> "$GITHUB_OUTPUT"
          fi

      - name: Resumo
        run: echo "### ${{ steps.destino.outputs.canal }} → grupo \`${{ steps.destino.outputs.grupo }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      # Gate: não se distribui o que não passou. Repetido aqui de propósito — a tag pode apontar para um
      # commit que nunca passou pelo CI (tag em commit antigo, tag criada à mão).
      - name: Suíte de regras (escopo)
        working-directory: firestore-tests
        run: npm ci && npm test

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
          grep -q '"project_id"' app/google-services.json || {
            echo "::error::GOOGLE_SERVICES_JSON ausente ou inválido"; exit 1;
          }

      - name: Testes JVM (escopo)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # A chave nunca fica no repositório: chega como secret, vira arquivo no runner e morre com ele.
      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/fluviapp-release.jks"
          [ -s "$RUNNER_TEMP/fluviapp-release.jks" ] || {
            echo "::error::KEYSTORE_BASE64 ausente ou inválido"; exit 1;
          }
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/fluviapp-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # `github.run_number` cresce sozinho e é rastreável até a execução que gerou o artefato (P3.3).
      # O nome vem da tag — e só dela: num `workflow_dispatch` o `ref_name` é o nome da branch, e um APK
      # chamado "master" não diz nada a ninguém. Vazio faz o Gradle cair no fallback local.
      - name: Montar APK assinado
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Conferir que saiu mesmo assinado
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      # A CLI se autentica pela service account (não há `firebase login` interativo num runner).
      # `--groups` e não `--testers`: quem administra a audiência é o console, não um secret com lista de
      # e-mails que ninguém lembra de atualizar quando alguém entra ou sai.
      - name: Distribuir
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GRUPO: ${{ steps.destino.outputs.grupo }}
          NOTAS: ${{ github.event.inputs.notas || github.ref_name }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$APP_ID" \
            --groups "$GRUPO" \
            --release-notes "$NOTAS"

      - name: Guardar o APK do run
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk