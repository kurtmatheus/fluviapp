name: CI

# A suíte de regras roda **inteira** — o recorte saiu em 2026-09-07 (ADR-0032 D3), depois de a medição
# mostrar que ele pulava 57 de 160 casos e que os 57 passavam.
#
# A suíte JVM **continua recortada** ao escopo da revitalização (ADR-0020), e ali o recorte ainda paga:
# vermelho significa "quebrei algo que estava funcionando", e não "existe passado". A assimetria é
# deliberada — 14 casos fora de 842 (1,7%) é recorte; 57 de 160 (36%) era um gate que passava sem olhar.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  regras:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    # Primeiro por ser o mais barato e o mais independente: roda no projeto `demo-fluviapp`, SEM
    # credencial nenhuma. É o gate que o P3.4 pedia — e as regras deste repo nunca foram deployadas,
    # então é aqui que se descobre o que elas quebram, antes de um usuário descobrir.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      # O emulador do Firestore é um processo Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        working-directory: firestore-tests
        run: npm ci

      - name: Suíte de regras (160 casos)
        working-directory: firestore-tests
        run: npm test

  jvm:
    name: Testes JVM + build debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # O plugin `com.google.gms.google-services` FALHA O BUILD sem este arquivo — inclusive no job de
      # testes, não só no de release. Ele é gitignored porque o repositório é público (portfólio), então
      # a esteira o recria a partir do secret.
      # `tr -d` porque o valor colado quase sempre traz quebra de linha ou espaço, e o `base64 -d` recusa
      # a entrada inteira por causa disso. A validação existe para o erro apontar o secret, e não um
      # "plugin falhou" três passos adiante.
      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::secret GOOGLE_SERVICES_JSON não está definido no repositório"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
          if ! grep -q '"project_id"' app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON decodificou para algo que não é o google-services.json"
            exit 1
          fi

      - name: Testes JVM (escopo)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug
        run: ./gradlew :app:assembleDebug --no-daemon

      # **O release, por causa do R8** (ligado em 2026-09-07).
      #
      # O problema que este passo resolve é de posição, não de configuração: o R8 só roda no release, e o
      # release só era construído pelo workflow de Distribuição — que dispara **em tag**. Ou seja, um R8
      # mal configurado apareceria depois do ponto de não-retorno, num APK já a caminho do tester.
      #
      # Sai **sem assinatura**, e isso basta: o que se prova aqui é que o encolhedor atravessa. Assinar é
      # outro eixo, com outra chave e outro workflow — e o `build.gradle.kts` já trata a ausência do
      # `keystore.properties` (o release compila, só não instala).
      #
      # De brinde vem o `lintVitalRelease`, que só existe no release e hoje não roda em lugar nenhum.
      #
      # O que ele **não** cobre continua não coberto: R8 quebra em tempo de execução, com sintoma mudo
      # (tela vazia, campo em branco), e isso só aparece percorrendo o app — ver `docs/esteira.md`.
      - name: Build release (R8, sem assinatura)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Guardar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-teste
          path: app/build/reports/tests/