# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# **Cache de build** (2026-09-07): reaproveita a saída de tarefa cujas entradas não mudaram, inclusive
# entre `clean`s — é o que faz um `clean assembleDebug` deixar de recompilar o que já foi compilado com
# a mesma entrada. É o ganho que mais aparece aqui, porque o app é um módulo só e o gargalo é a
# compilação do Compose, não o paralelismo entre projetos.
org.gradle.caching=true

# **Paralelismo**: com um módulo só, o ganho é pequeno por construção — não há projetos independentes
# para distribuir. Fica ligado porque não custa nada e passa a valer sozinho no dia em que o app for
# dividido em módulos (o que este plano deliberadamente não faz).
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# **KSP2 ligado em 2026-09-07**, depois de dois bloqueios caírem em sequência.
#
# A linha era `false` e a razão escrita ao lado era o **Room 2.6.1**, que só falava a API KSP1. Com o Room
# fora (ADR-0017 F6) ela foi virada, e o build respondeu na hora — com outro dono:
#
#     e: [ksp] [Hilt] Expected @AndroidEntryPoint to have a value. Did you forget to apply the Gradle
#     Plugin? (com.google.dagger.hilt.android)
#
# O processador do Hilt 2.53.1 roda sob a API nova, mas não enxerga o resultado do plugin, e todo
# `@AndroidEntryPoint`/`@HiltAndroidApp` fica sem valor. Não era configuração faltando: saía com **bump do
# Hilt**, e foi o que se fez (2.53.1 → 2.57.2), medido em vez de suposto — 828 casos JVM e 152
# instrumentados verdes no aparelho com a versão nova.
ksp.useKSP2=true